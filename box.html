<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .header{
            background-color: rgb(89, 5, 18);
            color: white;
            display: flex;
            justify-content: center;
            width: 100%;
            height: 65px;
            font-size: 30px;
        }
        .cate{
            background-color: rgb(89, 5, 18);
            color:white;
            display: flex ;
            justify-content:space-evenly;
            width: 100%;
            height: 35px;
            font-size: 20px;
        }
        .main{
            display: flex;
            justify-content: space-between
        }
        .grid-container {
            width: 100%;              /* container takes 75% of its parent's width */
            margin: 0;          /* optional: centers it on the page */
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 3 equal columns inside that 75% */
            gap: 5px;
       }
        .grid-item {
            background-color: rgb(186, 122, 133);
            color: white;
            padding: 150px;
            text-align: center;
        }
        .left{
            background-color: darkgreen;
            color: aquamarine;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50%;
            height: auto;
            font-size: 20px;
        }
        .right{
            background-color: aquamarine;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50%;
            height: auto;
            font-size: 20px;
        }
        .box{
            background-color: rgb(172, 115, 158);
            color: beige;
            display:flex;
            justify-content: center;
            align-items: center;
            width: 25%;
            height: auto;
            font-size: 20px;
        }
        .smallbox{
            background-color: chocolate;
            color: beige;
            display:flex;
            justify-content: center;
            align-items: center;
            width: 10%;
            height: auto;
            font-size: 20px;
        }
        .footer{
            background-color: rgb(125, 47, 117);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 35px;
            font-size: 20px;
        }
        </style>
</head>
<body>
   <div class="header">
    HEADER ELEMENT
   </div> 
   <div class="cate">
     <div class="home">Home</div>
        <div class="about">About</div>
        <div class="login">Login</div>
   </div>
   <div class="main">
    <div class="grid-container">
    <body>
  <div class="grid-container">
    <div class="left">
    <div class="grid-item">left</div>
    </div>
    <div class="right">
    <div class="grid-item">right</div>
    </div>
    <div class="box">
     <div class="grid-item">box1</div>
     <div class="grid-item">box2</div>
     <div class="grid-item">box3</div>
     <div class="grid-item">box4</div>
     </div>
     <div class="smallbox">
    <div class="grid-item">smallbox1</div>
    <div class="grid-item">smallbox2</div>
    <div class="grid-item">smallbox3</div>
    <div class="grid-item">smallbox4</div>
    <div class="grid-item">smallbox5</div>
    </div>
    </div>
</body>
</div>
