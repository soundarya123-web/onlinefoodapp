<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .header {
            width: 100%;
            height: 180px;
            background-color: rgb(89, 5, 18);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        .cate{
            background-color: rgb(89, 5, 18);
            color:white;
            display: flex ;
            justify-content:space-evenly;
            width: 100%;
            height: 35px;
            font-size: 20px;
        }
        .div {
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            margin-top: 30px;
            font-size: 22px;
        }
        .div a {
            color: white;
            text-decoration: none;
        }
        .div a {
            color: yellow;
        }
        .main {
            width: 100%;
            height: 150px;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
        .left {
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }
        .right {
            background-color: lightpink;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }
        .colors {
            width: 100%;
            height: 100px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
        }
        .blue {
            background-color: blue;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }
        .red {
            background-color: red;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }
        .green {
            background-color: green;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }
        .yellow {
            background-color: yellow;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }
        .boxes {
            width: 100%;
            height: 130px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
        }
        .box {
            background-color: rgb(186, 122, 133);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            font-weight: bold;
        }
        .footer {
            width: 100%;
            height: 60px;
            background-color: rgb(125, 47, 117);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div>
            Header
        </div>
        <div class="cate">
            <div class="home">Home</div>
            <div class="about">About</div>
            <div class="login">Login</div>
        </div>
    </header>
    <div class="main">
        <div class="left">
            Left
        </div>

        <div class="right">
            Right
        </div>
    </div>
    <div class="colors">
        <div class="blue">
            Blue
        </div>

        <div class="red">
            Red
        </div>

        <div class="green">
            Green
        </div>

        <div class="yellow">
            Yellow
        </div>
    </div>
    <div class="boxes">
        <div class="box">
            1
        </div>

        <div class="box">
            2
        </div>

        <div class="box">
            3
        </div>

        <div class="box">
            4
        </div>

        <div class="box">
            5
        </div>
    </div>
    <footer class="footer">
        Footer
    </footer>

</body>
</html>
