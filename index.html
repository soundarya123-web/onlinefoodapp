<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Two Childhoods ❤️</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            text-align: center;
            font-family: Arial, sans-serif;
            background: #fff5f8;
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
        }

        .photo {
            width: 90%;
            max-width: 700px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin-top: 35px;
            color: #444;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>❤️ "Two Childhoods in one frame." ❤️</h1>

    <!-- Your photo -->
    <img class="photo" src="soundjaya.jpg.jpeg" alt="Two Childhoods">

    <h2>Scan this QR 📱</h2>

    <!-- QR Code -->
    <div id="qrcode"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        new QRCode(document.getElementById("qrcode"), {
            text: "https://soundaryavemula1-web.github.io/my-photo2/soundjaya.jpg.jpeg",
            width: 200,
            height: 200
        });
    </script>

</body>

</html>
