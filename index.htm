<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .header{
            background-color: red;
            color: white;
            display: flex;
            justify-content: center;
            width: 100%;
            height: 65px;
            font-size: 30px;

        }
        .cate{
            background-color: red;
            color:white;
            display: flex ;
            justify-content:space-evenly;
            width: 100%;
            height: 35px;
            font-size: 20px;
        }
        .main{
            display: flex;
            justify-content: space-between;
        }   
        .left{
            width: 75%;
        }
        .right{
            width: 25%;
        }   
        .grid-container {
            width: 75%;              /* container takes 75% of its parent's width */
            margin: 0;          /* optional: centers it on the page */
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 equal columns inside that 75% */
            gap: 5px;
       }

        .grid-item {
            background-color: skyblue;
            color: white;
            padding: 150px;
            text-align: center;
        }
        .content{
            background-color: yellow;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 125px;
            font-size: 20px;
        }
        .side{
            background-color: green;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 443px;
            font-size: 20px;
        }
        .footer{
            background-color: blue;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 35px;
            font-size: 20px;
        }
    </style>
</head>
<body>
   <div class="header">
    HEADER ELEMENT
   </div> 
   <div class="cate">
     <div class="home">Home</div>
        <div class="about">About</div>
        <div class="login">Login</div>
   </div>
   <div class="main">
     <div class="left">
      <div class="grid-container">
        <div class="grid-item">Smallbox1</div>
        <div class="grid-item">Smallbox2</div>
        <div class="grid-item">Smallbox3</div>
      </div>
      <div class="content">
       MAIN CONTENT
      </div>
        </div>
     <div class="right">
      <div class="side">
           SIDE BAR
      </div>
     </div>
   </div>
   <div class="footer">
     FOOTER ELEMENT
   </div>
     
</body>
</html>
