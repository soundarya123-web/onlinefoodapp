<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLECommerce - Static E-Commerce Website</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:     #f5f5f5;
}

/* Header */

.header{
    background:#0D47A1;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
}

.logo{
    color:white;
    font-size:32px;
    font-weight:bold;
}

.logo span{
    color:yellow;
}

.search input[type=text]{
    width:350px;
    padding:10px;
    font-size:16px;
}

.search input[type=submit]{
    padding:10px 18px;
    font-size:16px;
    cursor:pointer;
}

.menu{
    color:white;
    font-size:20px;
    font-weight:bold;
}

/* Categories */

.category{
    background:#1976D2;
    display:flex;
    justify-content:space-around;
    padding:18px;
    color:white;
    font-size:20px;
    font-weight:bold;
}
.banner img{
    width:100%;
}
.custom{
    background:#cb52d1;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px 40px;
}

</style>

</head>

<body>

<!-- Header -->

<div class="header">

<div class="logo">
KLE<span>Commerce</span>
</div>

<div class="search">

<input type="text" placeholder="Search Products">

<input type="submit" value="Search">

</div>

<div class="menu">

Login |
Register |
Cart (0)

</div>

</div>

<!-- Categories -->

<div class="category">

<div>Fashion</div>

<div>Groceries</div>

<div>Electronics</div>

<div>Mobiles</div>

<div>Appliances</div>

<div>Beauty</div>

<div>Books</div>

<div>Sports</div>

</div>
<!--Banner-->
<div class="banner">
    <img src="C:\Users\koteswararao\Downloads\BMW.jpg">
</div>
<div class="custom">
    FEATURED PRODUCTS
</div>
</body>
</html>
